# Publishes the web app, the pwa folder, on GitHub Pages at every push that changes it.
name: Web app

on:
  push:
    branches: [main]
    paths: ['pwa/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The proxy and the tools are not part of the site.
      - run: cp -r pwa _site && rm -rf _site/worker _site/tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
